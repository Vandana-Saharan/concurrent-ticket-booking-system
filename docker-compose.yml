
services:
  postgres:
    image: postgres:17
    container_name: ticket-booking-postgres
    environment:
      POSTGRES_DB: ticket_booking
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_pass
    ports:
      - "5434:5432"
    volumes:
      - ticket_booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_user -d ticket_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ticket_booking_data:
